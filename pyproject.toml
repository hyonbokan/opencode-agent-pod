# Tooling config for the opencode-agent-pod. No packaging here — this file only
# configures ruff, mypy, and pytest so pre-commit and local runs share one
# source of truth.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/__pycache__", "build", "dist"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B),
# comprehensions (C4). Autofix handles most of these.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI relies on function calls in argument defaults (Depends/Query)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.ruff.format]
# ruff defaults (Black-compatible: double quotes, 4-space indent).

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["build/", "dist/"]
